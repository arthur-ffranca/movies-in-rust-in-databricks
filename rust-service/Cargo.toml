[package]
name = "apache"
version = "0.1.0"
edition = "2024"

[dependencies]
csv = "1.4.0"
fastembed = "7"
iggy = "0.10"
milvus-sdk-rust = "3.0.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.8.6", features = ["runtime-tokio-rustls", "postgres"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
